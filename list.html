<!DOCTYPE html>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header>
            <h1>All Questions</h1>
            <nav style="display: flex; gap: 1.5rem; justify-content: center; font-weight: 600; margin-bottom: 2rem;">
